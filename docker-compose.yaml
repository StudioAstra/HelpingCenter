services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      APP_ENV: prod
      APP_SECRET: "${APP_SECRET}"
    volumes:
      - php_var:/var/www/html/var
      - uploads:/var/www/html/public/uploads
    networks:
      - app
      - coolify

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    labels:
      - traefik.docker.network=coolify
      - traefik.http.services.helpcenter-nginx.loadbalancer.server.port=80
      - "traefik.http.routers.helpcenter-https.rule=Host(`help.getstudioastra.fr`)"
      - traefik.http.routers.helpcenter-https.entrypoints=https
      - traefik.http.routers.helpcenter-https.tls=true
      - traefik.http.routers.helpcenter-https.tls.certresolver=letsencrypt
      - traefik.http.routers.helpcenter-https.service=helpcenter-nginx
      - traefik.http.routers.helpcenter-https.priority=99999
      - "traefik.http.routers.helpcenter-http.rule=Host(`help.getstudioastra.fr`)"
      - traefik.http.routers.helpcenter-http.entrypoints=http
      - traefik.http.routers.helpcenter-http.middlewares=redirect-to-https
      - traefik.http.routers.helpcenter-http.priority=99999
    networks:
      - app
      - coolify

networks:
  app:
    driver: bridge
  coolify:
    external: true

volumes:
  php_var:
  uploads:
  node_modules:
