services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://helpcenter:${DB_PASSWORD}@database:3306/helpcenter?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      APP_ENV: prod
      APP_SECRET: "${APP_SECRET}"
    volumes:
      - php_var:/var/www/html/var
      - uploads:/var/www/html/public/uploads
    networks:
      - app

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    labels:
      - traefik.docker.network=coolify
    networks:
      - app
      - coolify

  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: helpcenter
      MARIADB_USER: helpcenter
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run build"
    profiles:
      - build

networks:
  app:
    driver: bridge
  coolify:
    external: true

volumes:
  database_data:
  php_var:
  uploads:
  node_modules:
