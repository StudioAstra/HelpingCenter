services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://helpcenter:helpcenter@database:3306/helpcenter?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      APP_ENV: dev
      APP_SECRET: "change-me-in-production"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - php

  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: helpcenter
      MARIADB_USER: helpcenter
      MARIADB_PASSWORD: helpcenter
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 10
      start_period: 30s

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run build"
    profiles:
      - build

volumes:
  database_data:
  php_vendor:
  php_var:
  node_modules:
